build_platform:
  linux_ppc64le: linux_64
noarch_platforms:
  # test on all platforms since we're doing some heavy unvendoring
  - linux_64
  - linux_aarch64
  - linux_ppc64le
  - osx_64
  - osx_arm64
  - win_64
conda_build:
  pkg_format: '2'
conda_build_tool: rattler-build
conda_forge_output_validation: true
github:
  branch_name: main
  tooling_branch_name: main
provider:
  linux_aarch64: default
  linux_ppc64le: default
  osx_arm64: default
  win: azure
test: native_and_emulated
