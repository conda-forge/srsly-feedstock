schema_version: 1

context:
  version: "2.5.5"

package:
  name: srsly
  version: ${{ version }}

source:
  url: https://github.com/explosion/srsly/archive/refs/tags/release-v${{ version }}.tar.gz
  sha256: 4ae7a5ffcc41f61b095fa1cf33891f430b5b841be0aea947a9b9f2fd6728a5b1
  patches:
    - patches/0002-Use-upstream-cloudpickle.patch
    - patches/0003-Use-upstream-ujson.patch
    - patches/0004-Update-JSON-tests-spaces-after-keys-by-default.patch
    - patches/0005-Unvendor-ruamel.yaml.patch
    - patches/0006-Unvendor-msgpack.patch
    # https://github.com/conda-forge/srsly-feedstock/issues/62
    # https://github.com/explosion/srsly/pull/122
    - patches/0007-Fix-backwards-compatibility-for-non-strict-map-keys.patch

build:
  number: 0
  noarch: python

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - python ${{ python_min }}.*
        - cross-python_${{ target_platform }}
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - catalogue >=2.0.3,<2.1.0
    - cloudpickle >=2.2.0
    - msgpack-python >=1.1
    - ruamel.yaml >=0.18.16
    - ujson >=1.35

tests:
  - python:
      imports:
        - srsly
        - srsly.tests
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - pytest
        - pytz
        - mock
        - numpy >=1.15.0
        - psutil
        - pip
    script:
      - python -m pytest --tb=native --pyargs srsly

about:
  license: MIT
  license_file: LICENSE
  summary: Modern high-performance serialization utilities for Python
  homepage: http://github.com/explosion/srsly

extra:
  recipe-maintainers:
    - rmax
    - honnibal
    - ines
    - h-vetinari
    - mgorny
